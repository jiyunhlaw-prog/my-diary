<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>나의 감성 다이어리</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#c4785a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="감성 다이어리">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Serif+KR:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ── 토큰 ──────────────────────────────────────────────── */
    :root {
      --cream:          #f3ede3;
      --cream-d:        #ebe3d5;
      --cream-dd:       #e0d5c5;
      --terra:          #c4785a;
      --terra-l:        #d4917a;
      --terra-d:        #a85f43;
      --brown:          #5c3d2e;
      --text-1:         #3d2b1f;
      --text-2:         #7a5c4a;
      --text-3:         #a08070;
      --white:          #faf7f2;
      --border:         rgba(196,120,90,.18);
      --shadow:         rgba(92,61,46,.10);
      --shadow-l:       rgba(92,61,46,.22);
      --r:              16px;
      --r-s:            9px;
      --side-w:         272px;
      --ease:           .28s cubic-bezier(.4,0,.2,1);
    }

    /* ── 리셋 ───────────────────────────────────────────────── */
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { height:100%; }
    body {
      font-family:'Noto Serif KR','Gowun Batang',serif;
      background:var(--cream);
      color:var(--text-1);
      height:100%;
      overflow:hidden;
    }
    button { font-family:inherit; cursor:pointer; }
    input, textarea { font-family:inherit; }

    /* ── 스크롤바 ───────────────────────────────────────────── */
    ::-webkit-scrollbar { width:5px; height:5px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--cream-dd); border-radius:3px; }
    ::-webkit-scrollbar-thumb:hover { background:var(--text-3); }

    /* ══════════════════ 레이아웃 ══════════════════ */
    .app { display:flex; height:100vh; overflow:hidden; }

    /* ── 사이드바 ───────────────────────────────────────────── */
    .sidebar {
      width:var(--side-w);
      background:var(--cream-d);
      border-right:1px solid var(--border);
      display:flex; flex-direction:column;
      overflow:hidden; flex-shrink:0;
      transition:transform var(--ease);
    }
    .sidebar-scroll { flex:1; overflow-y:auto; }

    /* 로고 */
    .sidebar-top {
      padding:22px 18px 14px;
      border-bottom:1px solid var(--border);
      flex-shrink:0;
    }
    .logo { display:flex; align-items:center; gap:10px; }
    .logo-icon {
      width:38px; height:38px; border-radius:11px;
      background:linear-gradient(135deg,var(--terra),var(--terra-d));
      display:flex; align-items:center; justify-content:center;
      font-size:19px; flex-shrink:0;
    }
    .logo-text { font-family:'Gowun Batang',serif; font-size:17px; font-weight:700; letter-spacing:-.3px; }
    .logo-sub { font-size:11px; color:var(--text-3); margin-top:3px; line-height:1.4; }

    /* 달력 */
    .cal-section { padding:16px 14px 8px; }
    .cal-head {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:10px;
    }
    .cal-nav {
      background:none; border:none; width:28px; height:28px;
      border-radius:7px; display:flex; align-items:center; justify-content:center;
      color:var(--text-2); font-size:16px; transition:background var(--ease),color var(--ease);
    }
    .cal-nav:hover { background:var(--border); color:var(--terra); }
    .cal-label { font-family:'Gowun Batang',serif; font-size:14px; font-weight:700; }
    .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
    .cal-dh {
      text-align:center; font-size:9.5px; color:var(--text-3);
      padding:3px 0; letter-spacing:.2px;
    }
    .cal-day {
      aspect-ratio:1; display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      border-radius:7px; font-size:11.5px; cursor:pointer;
      color:var(--text-2); transition:all var(--ease); position:relative;
    }
    .cal-day:hover { background:var(--cream-dd); }
    .cal-day.sun { color:#c07070; }
    .cal-day.sat { color:#7090c0; }
    .cal-day.today { background:var(--terra); color:#fff; font-weight:700; }
    .cal-day.today:hover { background:var(--terra-d); }
    .cal-day.has-dot::after {
      content:''; position:absolute; bottom:2px;
      width:4px; height:4px; border-radius:50%; background:var(--terra);
    }
    .cal-day.today.has-dot::after { background:#fff; }
    .cal-day.selected { background:var(--terra-l); color:#fff; }
    .cal-day.selected.today { background:var(--terra-d); }
    .cal-day.dim { opacity:.38; pointer-events:none; }

    /* 감정 필터 */
    .emo-filter { padding:14px 14px 10px; border-top:1px solid var(--border); }
    .sec-label {
      font-size:10px; color:var(--text-3); text-transform:uppercase;
      letter-spacing:1px; margin-bottom:9px;
    }
    .emo-chips { display:flex; flex-wrap:wrap; gap:5px; }
    .emo-chip {
      display:inline-flex; align-items:center; gap:3px;
      padding:3px 9px; border-radius:20px; font-size:11.5px;
      border:1.5px solid var(--border); background:transparent;
      color:var(--text-2); transition:all var(--ease);
    }
    .emo-chip:hover { border-color:var(--terra-l); color:var(--terra); }
    .emo-chip.on { background:var(--terra); border-color:var(--terra); color:#fff; }

    /* 통계 */
    .sidebar-stats { padding:14px; border-top:1px solid var(--border); }
    .stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
    .stat-card {
      background:var(--white); border-radius:var(--r-s);
      padding:11px 10px; text-align:center;
    }
    .stat-n { font-family:'Gowun Batang',serif; font-size:22px; font-weight:700; color:var(--terra); display:block; }
    .stat-l { font-size:10px; color:var(--text-3); margin-top:1px; }

    /* ── 메인 ───────────────────────────────────────────────── */
    .main { flex:1; display:flex; flex-direction:column; overflow:hidden; }

    /* 탑바 */
    .topbar {
      background:var(--cream); border-bottom:1px solid var(--border);
      padding:13px 22px; display:flex; align-items:center; gap:13px;
      flex-shrink:0;
    }
    .menu-btn {
      display:none; background:none; border:none; width:36px; height:36px;
      border-radius:8px; align-items:center; justify-content:center;
      font-size:18px; color:var(--text-2); transition:background var(--ease);
    }
    .menu-btn:hover { background:var(--border); }
    .search-wrap { flex:1; position:relative; }
    .search-icon { position:absolute; left:13px; top:50%; transform:translateY(-50%); font-size:14px; pointer-events:none; }
    .search-inp {
      width:100%; padding:10px 14px 10px 38px; border-radius:24px;
      border:1.5px solid var(--border); background:var(--white);
      font-size:13.5px; color:var(--text-1); outline:none;
      transition:border-color var(--ease),box-shadow var(--ease);
    }
    .search-inp:focus { border-color:var(--terra); box-shadow:0 0 0 3px rgba(196,120,90,.1); }
    .search-inp::placeholder { color:var(--text-3); }
    .view-toggle { display:flex; gap:3px; background:var(--cream-d); border-radius:9px; padding:3px; }
    .view-btn {
      background:none; border:none; width:31px; height:31px; border-radius:7px;
      display:flex; align-items:center; justify-content:center;
      font-size:15px; color:var(--text-3); transition:all var(--ease);
    }
    .view-btn.on { background:var(--white); color:var(--terra); box-shadow:0 1px 4px var(--shadow); }

    /* 엔트리 영역 */
    .entries-wrap { flex:1; overflow-y:auto; padding:22px; }
    .entries-head {
      display:flex; align-items:center; gap:8px;
      flex-wrap:wrap; margin-bottom:16px;
    }
    .entries-cnt { font-size:12.5px; color:var(--text-3); }
    .date-badge {
      display:inline-flex; align-items:center; gap:5px;
      padding:3px 10px 3px 9px; background:rgba(196,120,90,.1);
      border:1px solid rgba(196,120,90,.28); border-radius:14px;
      font-size:11.5px; color:var(--terra); cursor:pointer;
      transition:background var(--ease);
    }
    .date-badge:hover { background:rgba(196,120,90,.2); }
    .entries-grid { display:grid; gap:14px; }
    .entries-grid.g2 { grid-template-columns:repeat(2,1fr); }

    /* 카드 */
    .card {
      background:var(--white); border-radius:var(--r); padding:18px 18px 16px;
      cursor:pointer; transition:all var(--ease);
      border:1px solid transparent; position:relative; overflow:hidden;
      animation:fadeUp .35s ease both;
    }
    .card:hover { border-color:var(--border); box-shadow:0 5px 22px var(--shadow); transform:translateY(-2px); }
    .card-accent {
      position:absolute; top:0; left:0; width:4px; height:100%;
      background:linear-gradient(to bottom,var(--terra),var(--terra-l));
      border-radius:4px 0 0 4px;
    }
    .card-thumb { width:100%; height:130px; object-fit:cover; border-radius:var(--r-s); margin-bottom:12px; }
    .card-top { display:flex; align-items:flex-start; gap:12px; }
    .card-day-col { text-align:center; flex-shrink:0; }
    .card-day { font-family:'Gowun Batang',serif; font-size:30px; font-weight:700; color:var(--terra); line-height:1; }
    .card-dow { font-size:10px; color:var(--text-3); }
    .card-mon { font-size:10px; color:var(--text-2); }
    .card-body { flex:1; min-width:0; }
    .card-title { font-family:'Gowun Batang',serif; font-size:16px; font-weight:700; margin-bottom:6px; line-height:1.4; }
    .card-preview {
      font-size:12.5px; color:var(--text-2); line-height:1.75;
      display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
    }
    .card-foot {
      display:flex; align-items:center; justify-content:space-between;
      margin-top:12px; padding-top:10px; border-top:1px solid var(--border);
    }
    .card-emos { display:flex; flex-wrap:wrap; gap:4px; }
    .emo-badge {
      font-size:10.5px; padding:2px 7px; border-radius:10px;
      background:rgba(196,120,90,.1); color:var(--terra);
    }
    .card-pics { font-size:11px; color:var(--text-3); }

    /* 빈 상태 */
    .empty {
      text-align:center; padding:80px 20px; color:var(--text-3);
      grid-column:1/-1;
    }
    .empty-icon { font-size:52px; margin-bottom:14px; opacity:.55; }
    .empty-t { font-family:'Gowun Batang',serif; font-size:19px; color:var(--text-2); margin-bottom:7px; }
    .empty-d { font-size:13px; line-height:1.65; }

    /* ── FAB ────────────────────────────────────────────────── */
    .fab {
      position:fixed; bottom:30px; right:28px;
      width:58px; height:58px; border-radius:50%;
      background:linear-gradient(135deg,var(--terra),var(--terra-d));
      border:none; display:flex; align-items:center; justify-content:center;
      font-size:26px; color:#fff;
      box-shadow:0 4px 20px rgba(196,120,90,.52);
      transition:all var(--ease); z-index:90;
    }
    .fab:hover { transform:scale(1.1) rotate(12deg); box-shadow:0 6px 28px rgba(196,120,90,.65); }
    .fab:active { transform:scale(.95); }

    /* ══════════════════ 모달 ══════════════════ */
    .overlay {
      position:fixed; inset:0; background:rgba(61,43,31,.48);
      backdrop-filter:blur(5px); z-index:200;
      display:flex; align-items:center; justify-content:center; padding:18px;
      opacity:0; pointer-events:none; transition:opacity var(--ease);
    }
    .overlay.on { opacity:1; pointer-events:all; }
    .modal {
      background:var(--white); border-radius:22px;
      width:100%; max-width:660px; max-height:92vh;
      display:flex; flex-direction:column;
      transform:translateY(18px) scale(.97);
      transition:transform var(--ease);
      overflow:hidden;
    }
    .overlay.on .modal { transform:none; }
    .modal-hd {
      padding:22px 26px 15px; border-bottom:1px solid var(--border);
      display:flex; align-items:center; justify-content:space-between;
      flex-shrink:0;
    }
    .modal-hd-title { font-family:'Gowun Batang',serif; font-size:17px; font-weight:700; }
    .modal-close {
      background:var(--cream-d); border:none; width:34px; height:34px;
      border-radius:50%; display:flex; align-items:center; justify-content:center;
      font-size:16px; color:var(--text-2); transition:all var(--ease);
    }
    .modal-close:hover { background:var(--cream-dd); color:var(--text-1); }
    .modal-body { padding:22px 26px; overflow-y:auto; flex:1; }
    .modal-ft {
      padding:14px 26px 20px; display:flex; gap:10px; justify-content:flex-end;
      border-top:1px solid var(--border); flex-shrink:0;
    }

    /* 폼 */
    .fg { margin-bottom:18px; }
    .fl { display:block; font-size:10.5px; color:var(--text-3); text-transform:uppercase; letter-spacing:.9px; margin-bottom:7px; }
    .fi {
      width:100%; padding:11px 14px; border-radius:var(--r-s);
      border:1.5px solid var(--border); background:var(--cream);
      font-size:13.5px; color:var(--text-1); outline:none;
      transition:border-color var(--ease),box-shadow var(--ease);
    }
    .fi:focus { border-color:var(--terra); box-shadow:0 0 0 3px rgba(196,120,90,.1); }
    .fi::placeholder { color:var(--text-3); }
    .fi-title { font-family:'Gowun Batang',serif; font-size:17px; font-weight:700; }
    .fi-date { max-width:190px; }
    .fi-area { resize:none; min-height:170px; line-height:1.85; }

    /* 감정 피커 */
    .emo-picker { display:flex; flex-wrap:wrap; gap:7px; }
    .epc {
      display:inline-flex; align-items:center; gap:4px;
      padding:5px 13px; border-radius:20px; font-size:12.5px;
      border:1.5px solid var(--border); background:var(--cream);
      color:var(--text-2); transition:all var(--ease);
    }
    .epc:hover { border-color:var(--terra-l); background:rgba(196,120,90,.05); }
    .epc.on { background:var(--terra); border-color:var(--terra); color:#fff; }

    /* 사진 업로드 */
    .upload-area {
      border:2px dashed var(--border); border-radius:var(--r);
      padding:22px; text-align:center; cursor:pointer;
      transition:all var(--ease); background:var(--cream);
    }
    .upload-area:hover { border-color:var(--terra-l); background:rgba(196,120,90,.04); }
    .upload-area.drag { border-color:var(--terra); background:rgba(196,120,90,.08); }
    .upload-icon { font-size:28px; margin-bottom:7px; }
    .upload-txt { font-size:12.5px; color:var(--text-3); }
    .upload-hint { font-size:11px; color:var(--text-3); margin-top:3px; opacity:.7; }
    #file-inp { display:none; }
    .photo-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:7px; margin-top:10px; }
    .photo-item { position:relative; border-radius:var(--r-s); overflow:hidden; aspect-ratio:1; }
    .photo-img { width:100%; height:100%; object-fit:cover; }
    .photo-del {
      position:absolute; top:3px; right:3px; width:20px; height:20px;
      border-radius:50%; background:rgba(40,20,10,.65); border:none;
      color:#fff; font-size:11px; display:flex; align-items:center; justify-content:center;
      transition:background var(--ease);
    }
    .photo-del:hover { background:rgba(196,90,90,.9); }

    /* 버튼 */
    .btn {
      padding:10px 22px; border-radius:11px; font-size:13.5px; border:none;
      display:inline-flex; align-items:center; gap:5px; transition:all var(--ease);
    }
    .btn-p {
      background:linear-gradient(135deg,var(--terra),var(--terra-d)); color:#fff;
      box-shadow:0 2px 10px rgba(196,120,90,.38);
    }
    .btn-p:hover { transform:translateY(-1px); box-shadow:0 4px 16px rgba(196,120,90,.5); }
    .btn-s { background:var(--cream-d); color:var(--text-2); }
    .btn-s:hover { background:var(--cream-dd); }
    .btn-d { background:rgba(196,90,90,.1); color:#c46060; margin-right:auto; }
    .btn-d:hover { background:rgba(196,90,90,.2); }

    /* 뷰 모달 */
    .vm-date { display:flex; align-items:center; gap:14px; margin-bottom:18px; }
    .vm-day { font-family:'Gowun Batang',serif; font-size:52px; font-weight:700; color:var(--terra); line-height:1; }
    .vm-dow { font-size:13px; color:var(--text-3); }
    .vm-my { font-size:15px; color:var(--text-2); }
    .vm-title { font-family:'Gowun Batang',serif; font-size:22px; font-weight:700; line-height:1.4; margin-bottom:14px; }
    .vm-emos { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:18px; }
    .vm-emo {
      display:inline-flex; align-items:center; gap:4px;
      padding:4px 11px; border-radius:20px; font-size:12.5px;
      background:rgba(196,120,90,.1); color:var(--terra);
    }
    .vm-content { font-size:14.5px; line-height:1.95; white-space:pre-wrap; }
    .vm-photos { margin-top:22px; }
    .vm-photo-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:7px; margin-top:10px; }
    .vm-photo { width:100%; border-radius:var(--r-s); cursor:pointer; transition:transform var(--ease); display:block; }
    .vm-photo:hover { transform:scale(1.025); }

    /* 라이트박스 */
    .lightbox {
      position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:500;
      display:flex; align-items:center; justify-content:center;
      opacity:0; pointer-events:none; transition:opacity var(--ease);
    }
    .lightbox.on { opacity:1; pointer-events:all; }
    .lightbox img { max-width:92vw; max-height:92vh; object-fit:contain; border-radius:8px; }
    .lb-close {
      position:absolute; top:18px; right:18px;
      background:rgba(255,255,255,.14); border:none; color:#fff;
      font-size:22px; width:42px; height:42px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      transition:background var(--ease);
    }
    .lb-close:hover { background:rgba(255,255,255,.28); }

    /* 사이드바 오버레이 (모바일) */
    .side-overlay {
      display:none; position:fixed; inset:0;
      background:rgba(61,43,31,.38); z-index:140;
    }

    /* 토스트 */
    .toast {
      position:fixed; bottom:30px; left:50%;
      transform:translateX(-50%) translateY(16px);
      background:var(--brown); color:#fff;
      padding:11px 22px; border-radius:22px;
      font-size:13.5px; opacity:0; pointer-events:none;
      transition:all var(--ease); z-index:400; white-space:nowrap;
    }
    .toast.on { opacity:1; transform:translateX(-50%) translateY(0); }

    /* 애니메이션 */
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(14px); }
      to   { opacity:1; transform:none; }
    }
    .card:nth-child(1) { animation-delay:.04s; }
    .card:nth-child(2) { animation-delay:.08s; }
    .card:nth-child(3) { animation-delay:.12s; }
    .card:nth-child(4) { animation-delay:.16s; }
    .card:nth-child(5) { animation-delay:.20s; }

    /* ── 반응형 ─────────────────────────────────────────────── */
    @media (max-width:820px) {
      .entries-grid.g2 { grid-template-columns:1fr; }
    }
    @media (max-width:700px) {
      .sidebar {
        position:fixed; top:0; left:0; bottom:0; z-index:150;
        transform:translateX(-100%);
      }
      .sidebar.open { transform:none; }
      .side-overlay { display:block; }
      .menu-btn { display:flex; }
      .fab { bottom:18px; right:18px; }
      .topbar { padding:10px 14px; }
      .entries-wrap { padding:14px; }
      .modal { border-radius:18px; max-height:96vh; }
      .modal-body { padding:18px; }
      .modal-hd, .modal-ft { padding-left:18px; padding-right:18px; }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- ─────────── 사이드바 ─────────── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="logo">
        <div class="logo-icon">📔</div>
        <div>
          <div class="logo-text">나의 다이어리</div>
          <div class="logo-sub">오늘도 소중한 하루를 기록해요</div>
        </div>
      </div>
    </div>

    <div class="sidebar-scroll">
      <!-- 달력 -->
      <div class="cal-section">
        <div class="cal-head">
          <button class="cal-nav" id="cal-prev">‹</button>
          <span class="cal-label" id="cal-label"></span>
          <button class="cal-nav" id="cal-next">›</button>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>

      <!-- 감정 필터 -->
      <div class="emo-filter">
        <div class="sec-label">감정으로 보기</div>
        <div class="emo-chips" id="emo-chips"></div>
      </div>

      <!-- 통계 -->
      <div class="sidebar-stats">
        <div class="sec-label">기록 현황</div>
        <div class="stats-grid">
          <div class="stat-card"><span class="stat-n" id="s-total">0</span><div class="stat-l">총 일기</div></div>
          <div class="stat-card"><span class="stat-n" id="s-streak">0</span><div class="stat-l">연속 기록</div></div>
          <div class="stat-card"><span class="stat-n" id="s-month">0</span><div class="stat-l">이번 달</div></div>
          <div class="stat-card"><span class="stat-n" id="s-photos">0</span><div class="stat-l">사진</div></div>
        </div>
      </div>
    </div>
  </aside>

  <div class="side-overlay" id="side-overlay"></div>

  <!-- ─────────── 메인 ─────────── -->
  <main class="main">
    <div class="topbar">
      <button class="menu-btn" id="menu-btn">☰</button>
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="search-inp" id="search" type="text" placeholder="제목이나 내용으로 검색..." autocomplete="off" spellcheck="false">
      </div>
      <div class="view-toggle">
        <button class="view-btn on" id="vl" title="목록 보기">☰</button>
        <button class="view-btn" id="vg" title="그리드 보기">⊞</button>
      </div>
    </div>

    <div class="entries-wrap">
      <div class="entries-head">
        <span class="entries-cnt" id="e-cnt"></span>
        <button class="date-badge" id="date-badge" style="display:none">
          <span id="date-badge-txt"></span><span>✕</span>
        </button>
      </div>
      <div class="entries-grid" id="e-grid"></div>
    </div>
  </main>
</div>

<!-- FAB -->
<button class="fab" id="fab" title="새 일기 쓰기 (Ctrl+N)">✦</button>

<!-- ─────────── 작성 모달 ─────────── -->
<div class="overlay" id="write-overlay">
  <div class="modal">
    <div class="modal-hd">
      <span class="modal-hd-title" id="write-title">새 일기 쓰기</span>
      <button class="modal-close" id="write-x">✕</button>
    </div>
    <div class="modal-body">
      <div class="fg">
        <label class="fl">날짜</label>
        <input class="fi fi-date" type="date" id="f-date">
      </div>
      <div class="fg">
        <label class="fl">제목</label>
        <input class="fi fi-title" type="text" id="f-title" placeholder="오늘의 제목을 적어보세요">
      </div>
      <div class="fg">
        <label class="fl">감정</label>
        <div class="emo-picker" id="emo-picker"></div>
      </div>
      <div class="fg">
        <label class="fl">내용</label>
        <textarea class="fi fi-area" id="f-content" placeholder="오늘 어떤 하루를 보내셨나요?&#10;&#10;마음속 이야기를 자유롭게 적어보세요."></textarea>
      </div>
      <div class="fg">
        <label class="fl">사진</label>
        <div class="upload-area" id="upload-area">
          <div class="upload-icon">🖼️</div>
          <div class="upload-txt">사진을 드래그하거나 클릭해서 추가하세요</div>
          <div class="upload-hint">JPG · PNG · GIF · 최대 5장</div>
        </div>
        <input type="file" id="file-inp" accept="image/*" multiple>
        <div class="photo-grid" id="photo-grid"></div>
      </div>
    </div>
    <div class="modal-ft">
      <button class="btn btn-d" id="del-btn" style="display:none">🗑 삭제</button>
      <button class="btn btn-s" id="write-cancel">취소</button>
      <button class="btn btn-p" id="save-btn">✦ 저장하기</button>
    </div>
  </div>
</div>

<!-- ─────────── 보기 모달 ─────────── -->
<div class="overlay" id="view-overlay">
  <div class="modal">
    <div class="modal-hd">
      <span class="modal-hd-title">일기 보기</span>
      <button class="modal-close" id="view-x">✕</button>
    </div>
    <div class="modal-body" id="view-body"></div>
    <div class="modal-ft">
      <button class="btn btn-s" id="view-edit">✎ 수정</button>
      <button class="btn btn-p" id="view-close">닫기</button>
    </div>
  </div>
</div>

<!-- 라이트박스 -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lb-close">✕</button>
  <img id="lb-img" src="" alt="">
</div>

<!-- 토스트 -->
<div class="toast" id="toast"></div>

<script>
/* ════════════════════════════════════════════════════════
   감성 다이어리 — 메인 스크립트
════════════════════════════════════════════════════════ */

// ── 데이터 ────────────────────────────────────────────────
const EMOTIONS = [
  {e:'😊', l:'행복'}, {e:'😢', l:'슬픔'}, {e:'😠', l:'화남'},
  {e:'💕', l:'설렘'}, {e:'😰', l:'불안'}, {e:'😌', l:'평온'},
  {e:'🥺', l:'그리움'},{e:'🙏', l:'감사'}, {e:'😄', l:'신남'},
  {e:'🤔', l:'복잡'},
];
const DOW = ['일','월','화','수','목','금','토'];
const MON = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

// ── 상태 ────────────────────────────────────────────────
let entries      = JSON.parse(localStorage.getItem('diary_v2') || '[]');
let calY         = new Date().getFullYear();
let calM         = new Date().getMonth();
let selDate      = null;   // 'YYYY-MM-DD' | null
let filterEmos   = [];     // 선택된 감정 필터
let query        = '';
let viewMode     = 'list'; // 'list'|'grid'
let editId       = null;
let photos       = [];     // 현재 편집 중인 사진 배열
let viewEntry    = null;

// ── 저장 ────────────────────────────────────────────────
const save = () => localStorage.setItem('diary_v2', JSON.stringify(entries));

// ── 유틸 ────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function dateStr(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,'0');
  const d = String(date.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}

function today() { return dateStr(new Date()); }

function parseFmt(ds) {
  const d = new Date(ds + 'T00:00:00');
  return {
    y: d.getFullYear(), m: d.getMonth(), day: d.getDate(),
    dow: DOW[d.getDay()], mon: MON[d.getMonth()], wday: d.getDay(),
  };
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('on'), 2600);
}

// ── 달력 ────────────────────────────────────────────────
function renderCal() {
  $('cal-label').textContent = `${calY}년 ${MON[calM]}`;
  const grid = $('cal-grid');
  grid.innerHTML = DOW.map(d => `<div class="cal-dh">${d}</div>`).join('');

  const todayDs  = today();
  const dotSet   = new Set(entries.map(e => e.date));

  // 이번 달 1일이 무슨 요일인지 계산 → 그 전 일요일부터 시작
  const start = new Date(calY, calM, 1);
  start.setDate(1 - start.getDay()); // 달력 시작일 (이전 달 포함)

  // 6주(42칸) 고정
  for (let i = 0; i < 42; i++) {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    const ds    = dateStr(d);
    const isOur = d.getMonth() === calM;
    const dow   = d.getDay();

    const el = document.createElement('div');
    el.className  = 'cal-day';
    el.textContent = d.getDate();
    el.dataset.ds  = ds;

    if (dow === 0) el.classList.add('sun');
    if (dow === 6) el.classList.add('sat');
    if (!isOur)   el.classList.add('dim');
    if (ds === todayDs)  el.classList.add('today');
    if (dotSet.has(ds))  el.classList.add('has-dot');
    if (ds === selDate)  el.classList.add('selected');

    el.addEventListener('click', () => {
      selDate = selDate === ds ? null : ds;
      renderCal();
      updateDateBadge();
      renderEntries();
    });
    grid.appendChild(el);
  }
}

function updateDateBadge() {
  const b = $('date-badge');
  if (selDate) {
    const {y, mon, day, dow} = parseFmt(selDate);
    $('date-badge-txt').textContent = `${y}년 ${mon} ${day}일 (${dow})`;
    b.style.display = 'inline-flex';
  } else {
    b.style.display = 'none';
  }
}

// ── 감정 필터 칩 ────────────────────────────────────────
function renderEmoChips() {
  $('emo-chips').innerHTML = EMOTIONS.map(({e,l}) => `
    <button class="emo-chip${filterEmos.includes(l)?' on':''}" data-emo="${l}">${e} ${l}</button>
  `).join('');
  $('emo-chips').querySelectorAll('.emo-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      const em = btn.dataset.emo;
      filterEmos = filterEmos.includes(em) ? filterEmos.filter(x=>x!==em) : [...filterEmos, em];
      renderEmoChips();
      renderEntries();
    });
  });
}

// ── 통계 ────────────────────────────────────────────────
function updateStats() {
  $('s-total').textContent  = entries.length;

  const now = new Date();
  $('s-month').textContent  = entries.filter(e => {
    const d = new Date(e.date+'T00:00:00');
    return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  }).length;

  $('s-photos').textContent = entries.reduce((s,e)=>s+(e.photos?.length||0),0);

  // 연속 기록
  const set = new Set(entries.map(e=>e.date));
  let streak=0, td=new Date(); td.setHours(0,0,0,0);
  for(let i=0;i<365;i++){
    const tmp=new Date(td); tmp.setDate(td.getDate()-i);
    if(set.has(dateStr(tmp))) streak++;
    else if(i>0) break;
  }
  $('s-streak').textContent = streak;
}

// ── 엔트리 목록 ──────────────────────────────────────────
function getFiltered() {
  let res = [...entries];
  if (selDate)       res = res.filter(e => e.date === selDate);
  if (filterEmos.length) res = res.filter(e => filterEmos.some(em => e.emotions?.includes(em)));
  if (query.trim()) {
    const q = query.toLowerCase();
    res = res.filter(e => e.title?.toLowerCase().includes(q) || e.content?.toLowerCase().includes(q));
  }
  return res.sort((a,b)=>b.date.localeCompare(a.date));
}

function renderEntries() {
  const filtered = getFiltered();
  const grid     = $('e-grid');
  $('e-cnt').textContent = `${filtered.length}개의 일기`;

  grid.className = `entries-grid${viewMode==='grid'?' g2':''}`;

  if (!filtered.length) {
    grid.innerHTML = `
      <div class="empty">
        <div class="empty-icon">📔</div>
        <div class="empty-t">${query?'검색 결과가 없어요':'아직 일기가 없어요'}</div>
        <div class="empty-d">${query?'다른 검색어를 입력해 보세요.':'오른쪽 아래 ✦ 버튼을 눌러<br>첫 일기를 써보세요.'}</div>
      </div>`;
    return;
  }

  grid.innerHTML = '';
  filtered.forEach(entry => grid.appendChild(makeCard(entry)));
}

function makeCard(entry) {
  const {day, dow, mon} = parseFmt(entry.date);
  const card = document.createElement('div');
  card.className = 'card';

  const thumb = entry.photos?.[0]
    ? `<img class="card-thumb" src="${entry.photos[0]}" alt="사진">`
    : '';

  const emos = (entry.emotions||[]).map(l => {
    const found = EMOTIONS.find(x=>x.l===l);
    return `<span class="emo-badge">${found?.e||''} ${l}</span>`;
  }).join('');

  const pics = entry.photos?.length
    ? `<span class="card-pics">📷 ${entry.photos.length}</span>` : '';

  card.innerHTML = `
    <div class="card-accent"></div>
    ${thumb}
    <div class="card-top">
      <div class="card-day-col">
        <div class="card-day">${day}</div>
        <div class="card-dow">${dow}요일</div>
        <div class="card-mon">${mon}</div>
      </div>
      <div class="card-body">
        ${entry.title?`<div class="card-title">${esc(entry.title)}</div>`:''}
        <div class="card-preview">${esc(entry.content||'')}</div>
      </div>
    </div>
    <div class="card-foot">
      <div class="card-emos">${emos}</div>
      ${pics}
    </div>`;

  card.addEventListener('click', () => openView(entry));
  return card;
}

// ── 작성 모달 ────────────────────────────────────────────
function openWrite(entry=null) {
  editId = entry?.id ?? null;
  photos = entry?.photos ? [...entry.photos] : [];

  $('write-title').textContent = entry ? '일기 수정' : '새 일기 쓰기';
  $('del-btn').style.display   = entry ? 'inline-flex' : 'none';
  $('f-date').value            = entry?.date ?? today();
  $('f-title').value           = entry?.title ?? '';
  $('f-content').value         = entry?.content ?? '';

  renderEmoPicker(entry?.emotions||[]);
  renderPhotoGrid();
  autoResizeTextarea($('f-content'));

  $('write-overlay').classList.add('on');
  setTimeout(() => $('f-title').focus(), 300);
}

function closeWrite() {
  $('write-overlay').classList.remove('on');
  editId=null; photos=[];
}

function renderEmoPicker(sel=[]) {
  $('emo-picker').innerHTML = EMOTIONS.map(({e,l}) => `
    <button type="button" class="epc${sel.includes(l)?' on':''}" data-em="${l}">${e} ${l}</button>
  `).join('');
  $('emo-picker').querySelectorAll('.epc').forEach(btn => {
    btn.addEventListener('click', () => btn.classList.toggle('on'));
  });
}

function pickedEmos() {
  return [...document.querySelectorAll('.epc.on')].map(b=>b.dataset.em);
}

function renderPhotoGrid() {
  const g = $('photo-grid');
  g.innerHTML = '';
  photos.forEach((src,i) => {
    const item = document.createElement('div');
    item.className = 'photo-item';
    const img  = document.createElement('img');
    img.className = 'photo-img'; img.src = src;
    const del  = document.createElement('button');
    del.className='photo-del'; del.textContent='✕';
    del.addEventListener('click', ev => { ev.stopPropagation(); photos.splice(i,1); renderPhotoGrid(); });
    item.appendChild(img); item.appendChild(del);
    g.appendChild(item);
  });
}

function handleFiles(files) {
  const left = 5 - photos.length;
  if (!left) { toast('사진은 최대 5장까지 첨부할 수 있어요'); return; }
  [...files].slice(0,left).forEach(f => {
    if (!f.type.startsWith('image/')) return;
    const r=new FileReader();
    r.onload=e=>{photos.push(e.target.result); renderPhotoGrid();};
    r.readAsDataURL(f);
  });
}

function saveEntry() {
  const date    = $('f-date').value;
  const title   = $('f-title').value.trim();
  const content = $('f-content').value.trim();
  const emotions= pickedEmos();

  if (!date)            { toast('날짜를 선택해주세요'); return; }
  if (!title&&!content) { toast('제목이나 내용을 입력해주세요'); return; }

  if (editId) {
    const idx = entries.findIndex(e=>e.id===editId);
    if (idx!==-1) entries[idx]={...entries[idx],date,title,content,emotions,photos:[...photos]};
    toast('일기가 수정되었어요 ✦');
  } else {
    entries.push({id:Date.now(),date,title,content,emotions,photos:[...photos],createdAt:Date.now()});
    toast('일기가 저장되었어요 ✦');
  }
  save(); closeWrite(); refresh();
}

function deleteEntry(id) {
  if (!confirm('이 일기를 삭제할까요?')) return;
  entries = entries.filter(e=>e.id!==id);
  save(); closeWrite(); closeView(); refresh();
  toast('일기가 삭제되었어요');
}

// ── 보기 모달 ────────────────────────────────────────────
function openView(entry) {
  viewEntry = entry;
  const {y,day,dow,mon} = parseFmt(entry.date);
  const emos = (entry.emotions||[]).map(l=>{
    const f=EMOTIONS.find(x=>x.l===l);
    return `<span class="vm-emo">${f?.e||''} ${l}</span>`;
  }).join('');
  const hasPhotos = entry.photos?.length;

  $('view-body').innerHTML = `
    <div class="vm-date">
      <div class="vm-day">${day}</div>
      <div><div class="vm-dow">${dow}요일</div><div class="vm-my">${y}년 ${mon}</div></div>
    </div>
    ${entry.title?`<div class="vm-title">${esc(entry.title)}</div>`:''}
    ${emos?`<div class="vm-emos">${emos}</div>`:''}
    <div class="vm-content">${esc(entry.content||'')}</div>
    ${hasPhotos?`
      <div class="vm-photos">
        <div class="sec-label" style="margin-top:0">사진</div>
        <div class="vm-photo-grid" id="vm-pg"></div>
      </div>`:''}`;

  if (hasPhotos) {
    entry.photos.forEach(src => {
      const img = document.createElement('img');
      img.className='vm-photo'; img.src=src; img.alt='일기 사진';
      img.addEventListener('click', () => openLightbox(src));
      $('vm-pg').appendChild(img);
    });
  }

  $('view-overlay').classList.add('on');
}

function closeView() { $('view-overlay').classList.remove('on'); viewEntry=null; }

// ── 라이트박스 ───────────────────────────────────────────
function openLightbox(src) { $('lb-img').src=src; $('lightbox').classList.add('on'); }
function closeLightbox()   { $('lightbox').classList.remove('on'); }

// ── 자동 리사이즈 ────────────────────────────────────────
function autoResizeTextarea(el) {
  el.style.height='auto';
  el.style.height = el.scrollHeight+'px';
}

// ── 전체 렌더 ────────────────────────────────────────────
function refresh() {
  renderCal(); renderEmoChips(); updateStats(); renderEntries();
}

// ── 초기화 ───────────────────────────────────────────────
(function init() {
  refresh();

  // 달력 nav
  $('cal-prev').addEventListener('click', () => {
    calM--; if(calM<0){calM=11;calY--;} renderCal();
  });
  $('cal-next').addEventListener('click', () => {
    calM++; if(calM>11){calM=0;calY++;} renderCal();
  });

  // 날짜 필터 뱃지 삭제
  $('date-badge').addEventListener('click', () => {
    selDate=null; renderCal(); updateDateBadge(); renderEntries();
  });

  // 검색
  $('search').addEventListener('input', e => { query=e.target.value; renderEntries(); });

  // 뷰 토글
  $('vl').addEventListener('click', () => {
    viewMode='list'; $('vl').classList.add('on'); $('vg').classList.remove('on'); renderEntries();
  });
  $('vg').addEventListener('click', () => {
    viewMode='grid'; $('vg').classList.add('on'); $('vl').classList.remove('on'); renderEntries();
  });

  // FAB
  $('fab').addEventListener('click', () => openWrite());

  // 작성 모달
  $('write-x').addEventListener('click', closeWrite);
  $('write-cancel').addEventListener('click', closeWrite);
  $('save-btn').addEventListener('click', saveEntry);
  $('del-btn').addEventListener('click', () => deleteEntry(editId));
  $('write-overlay').addEventListener('click', e => { if(e.target===$('write-overlay')) closeWrite(); });

  // textarea 자동 리사이즈
  $('f-content').addEventListener('input', function(){ autoResizeTextarea(this); });

  // 보기 모달
  $('view-x').addEventListener('click', closeView);
  $('view-close').addEventListener('click', closeView);
  $('view-edit').addEventListener('click', () => { closeView(); openWrite(viewEntry); });
  $('view-overlay').addEventListener('click', e => { if(e.target===$('view-overlay')) closeView(); });

  // 사진 업로드
  const ua = $('upload-area'), fi = $('file-inp');
  ua.addEventListener('click', () => fi.click());
  fi.addEventListener('change', e => { handleFiles(e.target.files); fi.value=''; });
  ua.addEventListener('dragover', e => { e.preventDefault(); ua.classList.add('drag'); });
  ua.addEventListener('dragleave', () => ua.classList.remove('drag'));
  ua.addEventListener('drop', e => { e.preventDefault(); ua.classList.remove('drag'); handleFiles(e.dataTransfer.files); });

  // 라이트박스
  $('lb-close').addEventListener('click', closeLightbox);
  $('lightbox').addEventListener('click', e => { if(e.target===$('lightbox')) closeLightbox(); });

  // 모바일 사이드바
  const sb = $('sidebar'), so = $('side-overlay');
  $('menu-btn').addEventListener('click', () => { sb.classList.toggle('open'); so.classList.toggle('on'); });
  so.addEventListener('click', () => { sb.classList.remove('open'); so.classList.remove('on'); });

  // 키보드 단축키
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeWrite(); closeView(); closeLightbox(); }
    if ((e.ctrlKey||e.metaKey) && e.key==='n') { e.preventDefault(); openWrite(); }
  });

  // 서비스 워커
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () =>
      navigator.serviceWorker.register('./sw.js').catch(()=>{})
    );
  }

  // PWA 아이콘 동적 생성 (캔버스 → PNG)
  generateIcons();
})();

// ── PWA 아이콘 동적 생성 ─────────────────────────────────
function generateIcons() {
  [192, 512].forEach(size => {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    const r = size * 0.18;

    // 배경
    ctx.beginPath();
    ctx.moveTo(r,0); ctx.lineTo(size-r,0);
    ctx.quadraticCurveTo(size,0,size,r);
    ctx.lineTo(size,size-r);
    ctx.quadraticCurveTo(size,size,size-r,size);
    ctx.lineTo(r,size); ctx.quadraticCurveTo(0,size,0,size-r);
    ctx.lineTo(0,r); ctx.quadraticCurveTo(0,0,r,0);
    ctx.closePath();
    const grad = ctx.createLinearGradient(0,0,size,size);
    grad.addColorStop(0,'#c4785a'); grad.addColorStop(1,'#a85f43');
    ctx.fillStyle = grad; ctx.fill();

    // 이모지
    ctx.font = `${size*.52}px serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('📔', size/2, size/2 + size*.03);

    // link 태그로 등록
    const link = document.createElement('link');
    link.rel = 'apple-touch-icon';
    link.sizes = `${size}x${size}`;
    link.href = c.toDataURL('image/png');
    document.head.appendChild(link);
  });
}
</script>
</body>
</html>
